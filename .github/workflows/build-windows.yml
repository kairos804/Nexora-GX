name: Build Nexora GX for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/gemini-integration
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build installer and portable executable
        run: npm run build:win

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-GX-Windows-${{ github.sha }}
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
