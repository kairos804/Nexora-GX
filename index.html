<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora GX</title>
<style>
body{background:#0f0f0f;color:#0f0;font-family:monospace;margin:20px}button,input,select,textarea{background:#000;color:#0f0;border:1px solid #0f0;font-family:monospace;padding:8px}button{cursor:pointer}button:hover{background:#0f0;color:#000}.ai{margin-top:28px;border:1px solid #0f0;padding:16px;max-width:760px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.provider{min-width:130px}.provider.active{background:#0f0;color:#000}.chat{min-height:130px;white-space:pre-wrap;border:1px solid #063;margin:12px 0;padding:12px;color:#9f9}.status{font-size:12px;color:#7f7}
</style>
</head>
<body>
<h1>Nexora GX</h1><p>Bem vindo ao Nexora GX!</p><h6>version 1.2.2</h6><h4 id="clock"></h4>
<input id="url" placeholder="url ou pesquisa..." onkeydown="if(event.key==='Enter') ir()"><button onclick="ir()">Ir</button>
<h3>Nexora AI</h3>
<section class="ai">
<div><b>Escolha sua IA:</b></div>
<div class="row" id="providers"></div>
<div class="row"><label>Modelo: <select id="model"></select></label></div>
<div class="status" id="status">Configure uma chave de API no ambiente do Nexora para usar um provedor.</div>
<textarea id="prompt" rows="5" style="width:100%;box-sizing:border-box" placeholder="Digite sua pergunta..."></textarea>
<div class="row"><button onclick="askAI()">Enviar para a IA</button><button onclick="clearChat()">Limpar</button></div>
<div id="chat" class="chat">Nexora AI aguardando...</div>
</section>

<script>
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString(),1000);
function ir(){let v=document.getElementById('url').value.trim();if(!v)return;let u=v.includes('.')&&!v.includes(' ');if(u){if(!/^https?:\/\//i.test(v))v='https://'+v;try{let x=new URL(v);if(!/^https?:$/.test(x.protocol))return;location.href=x.href}catch{location.href='https://www.google.com/search?q='+encodeURIComponent(v)}}else location.href='https://www.google.com/search?q='+encodeURIComponent(v)}

const providers={
 openai:{name:'OpenAI',models:['gpt-5','gpt-5-mini']},
 anthropic:{name:'Claude',models:['claude-sonnet-4-5','claude-haiku-4-5']},
 gemini:{name:'Gemini',models:['gemini-2.5-flash','gemini-2.5-pro']},
 grok:{name:'Grok',models:['grok-4','grok-4-fast']}
};
let selected='openai';
const providerBox=document.getElementById('providers');const modelBox=document.getElementById('model');
for(const [id,p] of Object.entries(providers)){const b=document.createElement('button');b.className='provider';b.textContent=p.name;b.onclick=()=>selectProvider(id);b.dataset.id=id;providerBox.appendChild(b)}
function selectProvider(id){selected=id;document.querySelectorAll('.provider').forEach(b=>b.classList.toggle('active',b.dataset.id===id));modelBox.innerHTML=providers[id].models.map(m=>`<option value="${m}">${m}</option>`).join('');document.getElementById('status').textContent='Provedor selecionado: '+providers[id].name}
selectProvider('openai');

async function askAI(){const prompt=document.getElementById('prompt').value.trim();if(!prompt)return;const chat=document.getElementById('chat');chat.textContent='Nexora AI: processando...';try{const response=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:selected,model:modelBox.value,prompt})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Erro na API');chat.textContent=data.text||'Sem resposta.'}catch(e){chat.textContent='Erro: '+e.message+'\n\nO frontend está pronto, mas o endpoint /api/ai precisa estar conectado a um backend seguro com as chaves de API.'}}
function clearChat(){document.getElementById('chat').textContent='Nexora AI aguardando...';document.getElementById('prompt').value=''}
</script>
</body>
</html>
